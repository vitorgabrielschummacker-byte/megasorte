<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<title>Mega Sorte BR | Bora ganhar</title>
<meta name="description" content="Sorteios gratuitos e promoções com regras claras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#1D4ED8;--verde:#16A34A;--branco:#fff;--cinza:#eef2fb;--texto:#0f1a3d;--suave:#5a6585;--linha:#dbe2f5}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--texto);background:#fff;line-height:1.55}
h1,h2,h3,.num{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--azul);color:#fff}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.25rem;text-decoration:none;color:#fff}
nav a.ig{font-weight:600;text-decoration:none;color:#fff;font-size:.95rem;border:2px solid #fff;padding:7px 14px;border-radius:99px}
.hero p{margin-top:16px;max-width:48ch;font-size:1.08rem;opacity:.92}
.btn{display:inline-block;background:var(--verde);color:#fff;font-weight:600;text-decoration:none;padding:13px 24px;border-radius:12px;border:0;font-size:1rem;cursor:pointer;font-family:inherit;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;border:2px solid var(--azul);color:var(--azul)}
.btn.off{background:#c7cfe6;color:#4a5578;cursor:not-allowed;filter:none}
.btn.peq{padding:9px 15px;font-size:.88rem}
.btn.perigo{background:#b91c1c}
.hero .btn{margin-top:24px}
section{padding:0 0 48px}
h2{font-size:clamp(1.55rem,4vw,2.2rem);font-weight:800;margin-bottom:22px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--cinza);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card{background:#fff;border:1px solid var(--linha)}
.card .foto{display:block;width:100%;height:auto}
.card .corpo{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1}
.tag{align-self:flex-start;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;color:var(--azul)}
.tag.promo{background:var(--azul);color:#fff}
.card h3{font-size:1.35rem;line-height:1.15}
.desc{color:var(--suave);font-size:.95rem}
.premios{list-style:none;padding:0;display:grid;gap:5px}
.premios li{display:flex;gap:10px}
.premios b{color:var(--azul);min-width:28px}
.produto{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.produto strong{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem;color:var(--verde)}
.aut{font-size:.85rem;font-weight:600}
.aut.ok{color:var(--verde)}.aut.nao{color:#a16207}
.timer{display:flex;gap:8px}
.timer div{background:var(--azul);color:#fff;border-radius:12px;padding:7px 4px;min-width:60px;text-align:center}
.timer .num{font-size:1.6rem;font-weight:800;display:block;line-height:1.1}
.timer small{font-size:.7rem;opacity:.85}
.fim{color:var(--suave);font-size:.88rem}
.card.enc{opacity:.75}
details{font-size:.9rem;color:var(--suave)}
summary{cursor:pointer;font-weight:600;color:var(--azul)}
details p{margin-top:8px;white-space:pre-line}
.passos{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.passo{border-left:4px solid var(--verde);padding:4px 0 4px 16px}
.passo b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem}
.vazio{background:var(--cinza);border-radius:20px;padding:26px;color:var(--suave)}
.regras{background:var(--cinza);border-radius:20px;padding:26px}
.regras ul{padding-left:20px;display:grid;gap:8px}
footer{background:var(--texto);color:#cfd6ee;padding:30px 0;font-size:.86rem}

.hero{padding:10px 0 44px}
.hero .pre{font-size:1.05rem;font-weight:600;opacity:.9}
.hero h1{font-size:clamp(3.2rem,17vw,6rem);line-height:1;font-weight:800;margin-top:4px;min-height:1.1em;overflow:hidden}
.hero .sub{margin-top:14px;font-size:1rem;opacity:.9}
.palavra{display:inline-block;color:#fff;background:linear-gradient(transparent 62%,var(--verde) 62%);transition:transform .35s ease,opacity .35s ease}
.palavra.sai{transform:translateY(-60%);opacity:0}
.palavra.entra{transform:translateY(60%);opacity:0;transition:none}
.ticker{background:var(--texto);color:#fff;overflow:hidden;white-space:nowrap;font-weight:600;font-size:.9rem}
.ticker div{display:inline-block;padding:10px 0;animation:rola 28s linear infinite}
.ticker span{margin:0 22px}
@keyframes rola{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none}.palavra{transition:none}}
body{padding-bottom:env(safe-area-inset-bottom)}
nav{padding-top:calc(16px + env(safe-area-inset-top))}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.btn{display:block;width:100%;padding:15px 20px}
@media (min-width:640px){.btn{display:inline-block;width:auto}.card .btn{width:100%}}
.timer div{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.hero h1{animation:sobe .6s ease-out both}@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="#">🍀 Mega Sorte BR</a>
      <a class="ig" id="igTop" href="#" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <div class="hero">
      <p class="pre">Participe e concorra a</p>
      <h1><span id="palavra" class="palavra">prêmios</span></h1>
      <p class="sub">Sorteios com regra clara e resultado em vídeo.</p>
    </div>
  </div>
</header>
<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>

<main>
  <section id="campanhas" style="padding-top:36px">
    <div class="wrap">
      
      <div class="grid" id="abertas"></div>
    </div>
  </section>


  <section id="secGan" style="padding-top:0">
    <div class="wrap">
      <h2 style="font-size:1.2rem">Ganhadores</h2>
      <div id="ganhadores"></div>
    </div>
  </section>


  <section id="encerradas" style="padding-top:0">
    <div class="wrap">
      <h2 style="font-size:1.2rem;color:var(--suave)">Encerradas</h2>
      <div class="grid" id="fechadas"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p>© <span id="ano"></span> Mega Sorte BR. Não é patrocinado, administrado ou associado ao Instagram.</p>
  </div>
</footer>

<script>
/* ================== EDITE AQUI ================== */
const DADOS = {
  instagram: "https://www.instagram.com/megasortebr.oficial/",
  palavras: ["Prêmios","Pix","Celulares","Surpresas"],   /* palavras que se alternam no topo */
  faixa: ["🍀 Mega Sorte BR","🍀 Mega Sorte BR","🍀 Mega Sorte BR","🍀 Mega Sorte BR"],   /* faixa que rola */
  campanhas: [
    {
      id: 1,
      tipo: "gratuito",                 /* "gratuito" ou "promocao" */
      nome: "Primeiro Sorteio Mega Sorte BR",
      descricao: "Siga o perfil, curta a publicação e comente marcando 2 amigos.",
      foto: "iphone.png",      /* só o nome da imagem (paisagem), na mesma pasta do index.html */
      premio1: "Prêmio do 1º lugar | Iphone 17",
      premio2: "Prêmio do 2º lugar | 50 R$",
      premio3: "",
      fim: "2026-11-01T19:00",
      link: "https://www.instagram.com/megasortebr.oficial/",
      regras: "Participação gratuita. Resultado por sorteador online, gravado em vídeo. O ganhador tem 48h para responder ao direct.",
      produto: "", preco: "", cuponsPorCompra: 1, autorizacao: "", checkout: ""
    }
  ],
  ganhadores: [
    /* Só ganhadores reais. Ex.: { nome:"Maria S.", cidade:"Salvador/BA", premio:"Celular", data:"2026-11-01" } */
  ]
};
/* ================================================= */

const dados = DADOS;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'}) : '';
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const imgOk = u => /^(https?:\/\/|data:image\/|[\w\-.\/]+$)/i.test(u||'');
const urlOk = u => /^https?:\/\//i.test(u||'');

function card(c, aberta){
  const promo = c.tipo === 'promocao';
  const podeComprar = promo && c.autorizacao && urlOk(c.checkout);
  let acao = '';
  if(aberta){
    if(promo) acao = podeComprar
      ? `<a class="btn" href="${esc(c.checkout)}" target="_blank" rel="noopener">Comprar ${esc(c.produto||'produto')}</a>`
      : `<span class="btn off">Em breve</span>`;
    else acao = `<a class="btn" href="${esc(urlOk(c.link)?c.link:dados.instagram)}" target="_blank" rel="noopener">Participar no Instagram</a>`;
  }
  return `<article class="card ${aberta?'':'enc'}" data-fim="${esc(c.fim)}">
    ${c.foto?`<img class="foto" src="${esc(c.foto)}" alt="${esc(c.nome)}" loading="lazy">`:''}
    <div class="corpo">
      <span class="tag ${promo?'promo':''}">${promo?'Promoção comercial':'Sorteio gratuito'}</span>
      <h3>${esc(c.nome)}</h3>
      ${c.descricao?`<p class="desc">${esc(c.descricao)}</p>`:''}
      <ul class="premios">
        ${c.premio1?`<li><b>1º</b> ${esc(c.premio1)}</li>`:''}
        ${c.premio2?`<li><b>2º</b> ${esc(c.premio2)}</li>`:''}
        ${c.premio3?`<li><b>3º</b> ${esc(c.premio3)}</li>`:''}
      </ul>
      ${promo?`<div class="produto"><span>${esc(c.produto||'Produto')}<br><small class="fim">${Number(c.cuponsPorCompra)||1} cupom(ns) por compra</small></span><strong>${brl(c.preco)}</strong></div>
      <p class="aut ${c.autorizacao?'ok':'nao'}">${c.autorizacao?'Autorização nº '+esc(c.autorizacao):'Aguardando autorização'}</p>`:''}
      ${aberta?`<div class="timer"><div><span class="num" data-u="d">00</span><small>dias</small></div><div><span class="num" data-u="h">00</span><small>horas</small></div><div><span class="num" data-u="m">00</span><small>min</small></div><div><span class="num" data-u="s">00</span><small>seg</small></div></div>`:''}
      <p class="fim">${aberta?'Resultado em ':'Encerrada em '}${fmt(c.fim)}</p>
      ${c.regras?`<details><summary>Regulamento</summary><p>${esc(c.regras)}</p></details>`:''}
      ${acao}
    </div>
  </article>`;
}

function render(){
  const agora = Date.now();
  const val = c => c.fim && !isNaN(new Date(c.fim));
  const ab = dados.campanhas.filter(c=>val(c)&&new Date(c.fim)>agora).sort((a,b)=>new Date(a.fim)-new Date(b.fim));
  const fe = dados.campanhas.filter(c=>val(c)&&new Date(c.fim)<=agora).sort((a,b)=>new Date(b.fim)-new Date(a.fim));
  $('#abertas').innerHTML = ab.length ? ab.map(c=>card(c,true)).join('') : '<div class="vazio">Nenhuma campanha aberta agora. Siga o Instagram para saber da próxima.</div>';
  $('#fechadas').innerHTML = fe.map(c=>card(c,false)).join('');
  $('#encerradas').style.display = fe.length ? '' : 'none';
  $('#ganhadores').innerHTML = dados.ganhadores.length
    ? `<div class="grid">${dados.ganhadores.map(g=>`<div class="card"><div class="corpo"><h3>${esc(g.nome)}</h3><p>${esc(g.premio)}</p><p class="fim">${esc(g.cidade)} · ${esc(g.data)}</p></div></div>`).join('')}</div>`
    : '';
  $('#secGan').style.display = dados.ganhadores.length ? '' : 'none';
  $('#igTop').href = dados.instagram;
  tick();
}
function tick(){
  document.querySelectorAll('#abertas .card[data-fim]').forEach(c=>{
    const r = Math.max(0, new Date(c.dataset.fim) - Date.now());
    const v = {d:Math.floor(r/864e5), h:Math.floor(r%864e5/36e5), m:Math.floor(r%36e5/6e4), s:Math.floor(r%6e4/1e3)};
    for(const k in v){ const e=c.querySelector(`[data-u="${k}"]`); if(e) e.textContent=String(v[k]).padStart(2,'0'); }
  });
}
setInterval(tick,1000);


function animar(){
  const el=$('#palavra'), p=dados.palavras&&dados.palavras.length?dados.palavras:['prêmios'];
  el.textContent=p[0];
  const t=$('#ticker'); const f=(dados.faixa||[]).map(x=>`<span>${esc(x)}</span>`).join('');
  t.innerHTML=f+f+f+f;
  if(p.length<2||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let i=0;
  setInterval(()=>{
    el.classList.add('sai');
    setTimeout(()=>{ i=(i+1)%p.length; el.textContent=p[i]; el.classList.remove('sai'); el.classList.add('entra');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition='transform .35s ease,opacity .35s ease'; el.classList.remove('entra'); setTimeout(()=>el.style.transition='',400); }));
    },350);
  },2200);
}
animar();
$('#ano').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
